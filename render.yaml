services:
  - name: frontend
    type: static_site
    repo: https://github.com/adanjelle/wildlife.git
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: REACT_APP_API_URL
        value: https://your-backend-service.onrender.com

  - name: backend
    type: web
    repo: https://wildlife-backend.onrender.com
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
